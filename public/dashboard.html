<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Founder Inbox — Pipeline Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #0b0d10;
    --fg: #e8edf0;
    --muted: #8590a0;
    --panel: #13171c;
    --border: #1d242c;
    --accent: #5eead4;
    --warn: #fbbf24;
    --danger: #f87171;
    --ok: #34d399;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:32px 24px; }
  h1 { margin:0 0 4px; font-size:22px; font-weight:600; letter-spacing:-0.01em; }
  .sub { color:var(--muted); margin-bottom:24px; font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px 18px; }
  .card h2 { margin:0 0 10px; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:600; }
  .big { font-size:28px; font-weight:600; letter-spacing:-0.02em; margin:0; font-variant-numeric:tabular-nums; }
  .big .unit { font-size:14px; color:var(--muted); font-weight:400; margin-left:4px; }
  .bar { display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--border); margin-top:10px; }
  .bar > span { display:block; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--muted); margin-top:8px; }
  .legend > span { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:8px; height:8px; border-radius:2px; display:inline-block; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; color:var(--muted); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--border); font-size:11px; text-transform:uppercase; letter-spacing:0.04em; }
  td { padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr.row { cursor:pointer; transition:background 0.08s ease; }
  tr.row:hover { background:rgba(94,234,212,0.04); }
  td.num { font-variant-numeric:tabular-nums; text-align:right; color:var(--muted); }
  .tag { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:500; }
  .tag.investor { background:#3b2d0e; color:#fbbf24; }
  .tag.customer { background:#0a2a3a; color:#38bdf8; }
  .tag.partner { background:#1b2e1f; color:#4ade80; }
  .tag.press { background:#2e1a2b; color:#f472b6; }
  .tag.noise { background:#1d242c; color:var(--muted); }
  .tag.unknown { background:#2a1a1a; color:#f87171; }
  .tag.auto_send { background:#1a3c2a; color:var(--ok); }
  .tag.escalate { background:#3a2c0c; color:var(--warn); }
  .tag.drop { background:#1d242c; color:var(--muted); }
  .ok { color:var(--ok); }
  .fail { color:var(--danger); }
  .empty { color:var(--muted); padding:40px 0; text-align:center; }
  footer { color:var(--muted); font-size:12px; margin-top:32px; border-top:1px solid var(--border); padding-top:12px; }
  code { background:var(--border); padding:1px 6px; border-radius:3px; font-size:12px; }

  /* filters */
  .filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
  .filters-group { display:flex; gap:6px; flex-wrap:wrap; }
  .filters-label { font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-right:4px; }
  .chip { cursor:pointer; padding:4px 10px; border:1px solid var(--border); border-radius:14px; font-size:12px; color:var(--muted); background:transparent; user-select:none; transition:all 0.1s ease; }
  .chip:hover { border-color:#2a3540; color:var(--fg); }
  .chip.active { background:var(--border); color:var(--fg); border-color:#2a3540; }
  .chip .count { color:var(--muted); font-size:11px; margin-left:4px; font-variant-numeric:tabular-nums; }
  .chip.active .count { color:var(--muted); }
  .search { flex:1; min-width:200px; background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:6px 10px; color:var(--fg); font:inherit; font-size:12.5px; }
  .search:focus { outline:none; border-color:var(--accent); }
  .reset { cursor:pointer; color:var(--muted); font-size:12px; background:none; border:none; padding:6px 8px; text-decoration:underline; }
  .reset:hover { color:var(--fg); }
  .flag { display:inline-block; margin-left:6px; font-size:11px; color:var(--danger); }

  /* modal */
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.72); display:none; align-items:flex-start; justify-content:center; padding:40px 24px; overflow-y:auto; z-index:100; }
  .modal-backdrop.open { display:flex; }
  .modal { background:var(--panel); border:1px solid var(--border); border-radius:10px; width:100%; max-width:820px; padding:22px 26px 26px; position:relative; }
  .modal-close { position:absolute; top:12px; right:16px; background:transparent; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px 8px; border-radius:4px; }
  .modal-close:hover { color:var(--fg); background:var(--border); }
  .modal-head { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .modal-subject { font-size:16px; font-weight:600; margin:4px 0 2px; line-height:1.35; }
  .modal-meta { color:var(--muted); font-size:12.5px; margin-bottom:18px; display:flex; flex-wrap:wrap; gap:14px; }
  .modal-meta .sep { color:var(--border); }
  .section { margin-bottom:18px; }
  .section-title { font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); font-weight:600; margin-bottom:6px; }
  .section-body { background:#0f1318; border:1px solid var(--border); border-radius:6px; padding:10px 12px; font-size:13px; white-space:pre-wrap; line-height:1.5; }
  .section-body.muted { color:var(--muted); font-style:italic; }
  .claim { border-left:2px solid var(--accent); padding:6px 10px 6px 12px; margin-bottom:8px; background:#0f1318; border-radius:0 6px 6px 0; }
  .claim-match { font-size:12.5px; margin-bottom:4px; }
  .claim-match strong { color:var(--accent); font-weight:500; }
  .claim-cite { font-size:11.5px; color:var(--muted); margin-top:2px; padding-left:8px; border-left:1px solid var(--border); }
  .claim-cite b { color:#8fe1d0; font-weight:500; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:12.5px; margin-bottom:6px; }
  .kv dt { color:var(--muted); }
  .kv dd { margin:0; }
</style>
</head>
<body>
<main>
  <h1>Founder Inbox <span style="color:var(--muted);font-weight:400;">— Pipeline Dashboard</span></h1>
  <div class="sub" id="sub">loading…</div>

  <div class="grid" id="kpis"></div>

  <div class="card" style="margin-bottom:24px;">
    <h2>Decision breakdown</h2>
    <div class="bar" id="decision-bar"></div>
    <div class="legend" id="decision-legend"></div>
  </div>

  <div class="card" style="margin-bottom:24px;">
    <h2>Intent distribution</h2>
    <div class="bar" id="intent-bar"></div>
    <div class="legend" id="intent-legend"></div>
  </div>

  <div class="card">
    <h2>Recent events <span style="color:var(--muted);font-weight:400;">— click a row for full drill-down</span></h2>
    <div class="filters">
      <div class="filters-group" id="intent-chips"></div>
      <div class="filters-group" id="decision-chips"></div>
      <input class="search" id="search" type="search" placeholder="Search subject, from, reasoning…" autocomplete="off">
      <button class="reset" id="reset">reset</button>
    </div>
    <div id="events-table"></div>
  </div>

  <footer>
    Reads <code>events.jsonl</code>. No server, no DB. Polls every 5s — rerun your pipeline and watch new rows appear.
  </footer>
</main>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal" role="dialog" aria-labelledby="modal-subject">
    <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<script src="./dashboard.js"></script>
</body>
</html>
